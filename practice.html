<body class="app-shell-body app-shell">

<div class="app-container practice-page page-stagger app-top-safe" style="padding-top:28px;">

    </div>
    <div style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.2);color:#fb923c;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:0.9rem;">
      <span>🔥</span>
      <span id="prac-streak">7</span>
    </div>
  </div>

  <!-- Review Words -->
  <a href="flashcards.html" class="prac-card press-flash">
    <div class="prac-icon pc-review">🧠</div>
    <div class="prac-info">
      <div class="prac-name">Review Words</div>
      <div class="prac-desc" id="review-count">24 words ready</div>
    </div>
    <div class="prac-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </a>

  <!-- Quick Quiz -->
  <a href="quiz.html" class="prac-card press-flash">
    <div class="prac-icon pc-quiz">⚡</div>
    <div class="prac-info">
      <div class="prac-name">Quick Quiz</div>
      <div class="prac-desc">10 questions</div>
    </div>
    <div class="prac-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </a>

  <!-- Spaced Repetition -->
  <a href="study.html" class="prac-card press-flash">
    <div class="prac-icon pc-spaced">🔄</div>
    <div class="prac-info">
      <div class="prac-name">Spaced Repetition</div>
      <div class="prac-desc" id="spaced-count">18 words due</div>
    </div>
    <div class="prac-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>
  </a>

  <!-- Listening Practice -->
  <a href="study.html?mode=listen" class="prac-card press-flash">
    <div class="prac-icon pc-listen">🎧</div>
    <div class="prac-info">
      <div class="prac-name">Listening Practice</div>
      <div class="prac-desc">15 minutes</div>
    </div>
    <div class="prac-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

  <!-- Writing Practice -->

    <div class="prac-icon pc-write">✍️</div>
    <div class="prac-info">
      <div class="prac-name">Writing Practice</div>
      <div class="prac-desc">5 exercises</div>
    </div>
    <div class="prac-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

  <div style="height: 24px;"></div>

<script src="firebase.js"></script>
<script src="effects.js"></script>
<script src="ripple.js"></script>
<script src="transition.js"></script>
<script src="bottom-nav.js"></script>
<script>
(function(){
  document.body.classList.add('az-ready');
  // Hydrate streak from firebase
  function animateCounter(elId, target, duration = 800) {
    const el = document.getElementById(elId);
    if (!el) return;
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased);
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function hydrate() {
    const auth = window.firebase && firebase.auth;
    const db   = window.firebase && firebase.firestore;
    if (!auth || !db) return;
    auth().onAuthStateChanged(async (user) => {
      if (!user) return;
      try {
        const snap = await db().collection('users').doc(user.uid).get({ source: 'default' });
        const data = snap.exists ? (snap.data() || {}) : {};
        const streak = Array.isArray(data.streakDays) ? data.streakDays.length : (Number(data.streak || 0));
        animateCounter('prac-streak', streak);
      } catch (e) {}
    });
  }
  hydrate();
  // press flash position
  document.querySelectorAll('.press-flash').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--press-x', ((e.clientX - r.left) / r.width * 100) + '%');
      el.style.setProperty('--press-y', ((e.clientY - r.top)  / r.height * 100) + '%');
    });
  });
})();
</script>
</body>
</html>
